[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-carbon-employment-wages"
version = "1.0.0"
description = "Skill-disaggregated carbon, employment and wage accounting in international trade"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ScarfQian"}]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "pymrio==0.6.2",
  "pymoo==0.6.1.6",
  "networkx==3.3",
  "openpyxl==3.1.0"
]

[project.optional-dependencies]
test = ["pytest==7.4.4"]

[project.scripts]
carbon-labour = "carbon_labour.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
